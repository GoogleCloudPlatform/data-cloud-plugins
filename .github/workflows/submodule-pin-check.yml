name: Check Submodule Pins

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pin-check:
    name: Verify submodule pins match declared tags
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Fetch submodule tags
        # describe --exact-match needs tag objects present in each submodule.
        run: git submodule foreach 'git fetch --tags --quiet origin || true'

      - name: Check submodule pins
        run: ./.github/scripts/check-submodule-pins.sh
